name: Continuous Integration and Deployment

on:
  push:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run Maven tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Build Docker image
        run: docker build --tag vaadin-devops-learning:ci .

  deploy:
    name: Publish and deploy
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_USERNAME }}/vaadin-devops-learning

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push commit image
        run: |
          docker build --tag "$IMAGE_NAME:$GITHUB_SHA" .
          docker push "$IMAGE_NAME:$GITHUB_SHA"

      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/vaadin_deploy
          chmod 600 ~/.ssh/vaadin_deploy

      - name: Deploy image on GCP VM
        run: |
          ssh \
            -i ~/.ssh/vaadin_deploy \
            -o StrictHostKeyChecking=accept-new \
            "deployer@${{ vars.VM_HOST }}" \
            "set -e; \
             docker pull '$IMAGE_NAME:$GITHUB_SHA'; \
             docker rm --force vaadin-app || true; \
             docker run --detach \
               --name vaadin-app \
               --restart always \
               --publish 8081:8081 \
               --env PORT=8081 \
               '$IMAGE_NAME:$GITHUB_SHA'"
